<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Scroll-morphing 3D Sphere</title>
    <style>
      /* make the demo tall so page scrolls (inside the iframe you can control height) */
      html,body{height:200vh;margin:0;background:#09090b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto}
      #scene {
	  position:fixed; inset:0; width:100%; height:100%; pointer-events:none;
	  display:block;
      }
      .ui {
	  position:fixed; left:12px; top:12px; z-index:10; pointer-events:auto;
	  background:rgba(0,0,0,0.35); padding:8px 10px; border-radius:8px;
	  backdrop-filter: blur(4px);
      }
      .credit { opacity:0.7; font-size:12px }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="ui">
      <div>Scroll to morph & rotate</div>
      <div class="credit">3D morph sphere — embed inside iframe</div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

    <script>
      (() => {
	  const canvas = document.getElementById('scene');
	  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha:true });
	  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
	  renderer.setSize(innerWidth, innerHeight, false);
	  renderer.outputColorSpace = THREE.SRGBColorSpace || undefined;

	  const scene = new THREE.Scene();

	  // Camera
	  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
	  camera.position.set(0, 0, 3.6);

	  // Lights
	  const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 0.7);
	  scene.add(hemi);
	  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
	  dir.position.set(5,5,5);
	  scene.add(dir);

	  // Geometry & material: we will use a custom shader material with vertex displacement (simple noise)
	  const geometry = new THREE.IcosahedronGeometry(1, 6); // high subdivision for smoother morph
	  // Custom shader
	  const material = new THREE.ShaderMaterial({
	      uniforms: {
		  uTime: { value: 0 },
		  uAmp: { value: 0.25 },      // base amplitude
		  uScroll: { value: 0 },      // 0..1 scroll factor
		  uColor1: { value: new THREE.Color(0x7afcff) },
		  uColor2: { value: new THREE.Color(0x6b4cff) },
		  uLightDir: { value: new THREE.Vector3(0.5,0.6,0.7) }
	      },
	      vertexShader: `
      // Simplex noise (2-3d) - public domain variant
      vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min( g.xyz, l.zxy );
      vec3 i2 = max( g.xyz, l.zxy );
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - 0.5;
      i = mod289(i);
      vec4 p = permute( permute( permute(
      i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
      + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
      + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
      float n_ = 0.142857142857;
      vec3 ns = n_ * vec3(1.0,1.0,1.0) - 0.0;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.y;
      vec4 y = y_ * ns.x + ns.y;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4( x.xy, y.xy );
      vec4 b1 = vec4( x.zw, y.zw );
      vec4 s0 = floor(b0) * 2.0 + 1.0;
      vec4 s1 = floor(b1) * 2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
      vec3 p0 = vec3(a0.x, a0.y, h.x);
      vec3 p1 = vec3(a0.z, a0.w, h.y);
      vec3 p2 = vec3(a1.x, a1.y, h.z);
      vec3 p3 = vec3(a1.z, a1.w, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1),
      dot(p2,x2), dot(p3,x3) ) );
      }

      uniform float uTime;
      uniform float uAmp;
      uniform float uScroll;
      varying vec3 vNormal;
      varying vec3 vPos;
      void main(){
      vNormal = normalize(normalMatrix * normal);
      // displacement: base + scroll-controlled + time oscillation
      float noise = snoise(vec3(position * 1.3 + vec3(0.0, uTime * 0.2, 0.0)));
      float scrollBoost = pow(uScroll, 1.6) * 1.6;
      float displacement = (noise * 0.6 * uAmp) * (0.5 + scrollBoost);
      // Add a slower global pulsation
      displacement += 0.08 * sin(uTime * 0.8 + length(position) * 4.0) * (0.8 + uScroll);
      vec3 newPos = position + normal * displacement;
      vPos = newPos;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
      }
      `,
      fragmentShader: `
      precision highp float;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uLightDir;
      varying vec3 vNormal;
      varying vec3 vPos;
      void main(){
      vec3 n = normalize(vNormal);
      float diff = max(dot(n, normalize(uLightDir)), 0.0);
      float rim = pow(1.0 - max(dot(normalize(vPos), n), 0.0), 3.0);
      vec3 base = mix(uColor1, uColor2, (vPos.y + 1.2) * 0.4);
      vec3 color = base * (0.3 + diff * 1.1) + rim * 0.15;
      gl_FragColor = vec4(color, 1.0);
      }
      `,
      flatShading: false,
      // transparent: true,
      });

      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // track scroll inside the iframe: normalized 0..1 based on document scroll (body)
      let scrollFactor = 0;
      function updateScroll() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const sc = maxScroll > 0 ? window.scrollY / maxScroll : 0;
	scrollFactor = Math.min(Math.max(sc, 0), 1);
	material.uniforms.uScroll.value = scrollFactor;
	// also slightly move camera based on scroll
	camera.position.z = 3.2 + 0.8 * Math.sin(scrollFactor * Math.PI * 0.5);
	}

	addEventListener('scroll', updateScroll, { passive:true });
	addEventListener('resize', () => {
	renderer.setSize(innerWidth, innerHeight, false);
	camera.aspect = innerWidth / innerHeight;
	camera.updateProjectionMatrix();
	});

	// Smooth time
	let t0 = performance.now();
	let last = t0;
	let rotBase = 0;
	function animate(now) {
	const elapsed = (now - t0) * 0.001;
	const dt = (now - last) * 0.001;
	last = now;

	// rotation speed increases with scroll
	const speed = 0.15 + scrollFactor * 1.6;
	rotBase += speed * dt;

	// gentle auto rotation plus slow bob
	mesh.rotation.y = rotBase * 0.7;
	mesh.rotation.x = 0.15 * Math.sin(rotBase * 0.3);

	// feed uniforms
	material.uniforms.uTime.value = elapsed;
	// amplitude base 0.2..0.5 depending on scroll
	material.uniforms.uAmp.value = 0.14 + Math.pow(scrollFactor, 0.9) * 0.7;

	renderer.render(scene, camera);
	requestAnimationFrame(animate);
	}
	updateScroll();
	requestAnimationFrame(animate);

	// For pointer interaction (optional subtle tilt when mouse moves)
	window.addEventListener('mousemove', (e) => {
	const nx = (e.clientX / innerWidth - 0.5) * 2;
	const ny = (e.clientY / innerHeight - 0.5) * 2;
	mesh.rotation.x = THREE.MathUtils.lerp(mesh.rotation.x, ny * 0.25, 0.06);
	mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, -nx * 0.25, 0.06);
	}, { passive:true });

	// Expose small helper for debugging (optional)
	window.__morphSphere = {
	setColors: (c1, c2) => {
	material.uniforms.uColor1.value.set(c1);
	material.uniforms.uColor2.value.set(c2);
	}
	};

	// ensure canvas size fits device pixel ratio changes
	let DPR = window.devicePixelRatio || 1;
	const checkDPR = () => {
	const d = window.devicePixelRatio || 1;
	if (d !== DPR) {
	DPR = d;
	renderer.setPixelRatio(Math.min(DPR,2));
	renderer.setSize(innerWidth, innerHeight, false);
	}
	requestAnimationFrame(checkDPR);
	};
	checkDPR();

	// Clean up if loaded in SPA context (not strictly needed for static iframe)
	window.addEventListener('beforeunload', () => {
	geometry.dispose();
	material.dispose();
	renderer.dispose();
	});

	})();
    </script>
  </body>
</html>
